name: Browser smoke test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'geometry-v3.js'
      - 'studio-v3.js'
      - 'hardware-editor.js'
      - 'hardware-layout.js'
      - 'wire-routing.js'
      - 'print-advisor.js'
      - 'pixel-profiles.js'
      - 'fit-calibration.js'
      - 'pixel-profile-diagram.js'
      - 'light-port-plan.js'
      - 'cura-model-advisor.js'
      - 'cura-profiles.js'
      - 'print-quality.js'
      - 'optical-audit.js'
      - 'split-joints.js'
      - 'design-workflows.js'
      - 'production-pack.js'
      - 'targeted-light-paths.js'
      - 'detachable-plate.js'
      - 'fabrication-v1.js'
      - 'tests/browser-smoke.mjs'
      - 'package.json'
      - '.github/workflows/browser-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'geometry-v3.js'
      - 'studio-v3.js'
      - 'hardware-editor.js'
      - 'hardware-layout.js'
      - 'wire-routing.js'
      - 'print-advisor.js'
      - 'pixel-profiles.js'
      - 'fit-calibration.js'
      - 'cura-profiles.js'
      - 'print-quality.js'
      - 'optical-audit.js'
      - 'split-joints.js'
      - 'design-workflows.js'
      - 'production-pack.js'
      - 'targeted-light-paths.js'
      - 'detachable-plate.js'
      - 'fabrication-v1.js'
      - 'fabrication-worker.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/browser-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Cache the npm package tarballs between branches; no lockfile needed
      # for a best-effort cache. The runner's system Chrome avoids the 200 MB+
      # Playwright Chromium download that can time out before tests start.
      - name: Cache browser dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            node_modules
          key: ${{ runner.os }}-cf-browser-node22-${{ hashFiles('package.json') }}
          restore-keys: |
            ${{ runner.os }}-cf-browser-node22-
      - name: Install browser test dependencies
        id: install
        timeout-minutes: 6
        continue-on-error: true
        run: |
          set +e
          npm_config_fetch_retries=1 npm_config_fetch_timeout=40000 \
            npm install --prefer-offline --no-audit --no-fund --no-progress > /tmp/npm-install.log 2>&1
          npm_status=$?
          if [ "$npm_status" -ne 0 ]; then
            echo "NPM dependency installation failed (last 90 lines):"
            tail -n 90 /tmp/npm-install.log
            exit "$npm_status"
          fi
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CRYSTAL_FORGE_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
            google-chrome --version
          elif command -v chromium >/dev/null 2>&1; then
            echo "CRYSTAL_FORGE_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
            chromium --version
          else
            # Only download Playwright's bundled browser if the runner has
            # no preinstalled Chrome/Chromium. Avoid apt-get --with-deps.
            timeout 180s npx playwright install chromium > /tmp/playwright-install.log 2>&1
            browser_status=$?
            if [ "$browser_status" -ne 0 ]; then
              echo "Chromium fallback installation failed:"
              tail -n 90 /tmp/playwright-install.log
              exit "$browser_status"
            fi
          fi
          echo "Browser test dependencies and Chromium are ready."
      - name: Print dependency logs on installation failure
        if: steps.install.outcome != 'success'
        run: |
          echo '== npm install tail =='
          tail -n 100 /tmp/npm-install.log || true
          echo '== browser install tail =='
          tail -n 100 /tmp/playwright-install.log || true
      - name: Start local static host
        if: steps.install.outcome == 'success'
        run: |
          python3 -m http.server 4321 > /tmp/crystal-forge-server.log 2>&1 &
          sleep 2
      - name: Exercise live browser and fabrication pipeline
        if: steps.install.outcome == 'success'
        id: browser
        continue-on-error: true
        run: |
          mkdir -p qa
          set +e
          npm run test:browser > browser-run.log 2>&1
          status=$?
          cat browser-run.log
          exit "$status"
      - name: Upload browser test output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-forge-browser-test-log
          path: browser-run.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crystal-forge-browser-screenshot
          path: qa/browser-smoke.png
          if-no-files-found: ignore
      - name: Fail on browser errors
        if: steps.install.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
