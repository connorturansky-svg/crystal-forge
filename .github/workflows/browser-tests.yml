name: Browser smoke test
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'geometry-v3.js'
      - 'studio-v3.js'
      - 'hardware-editor.js'
      - 'hardware-layout.js'
      - 'wire-routing.js'
      - 'print-advisor.js'
      - 'pixel-profiles.js'
      - 'cura-profiles.js'
      - 'print-quality.js'
      - 'optical-audit.js'
      - 'split-joints.js'
      - 'design-workflows.js'
      - 'production-pack.js'
      - 'pixel-profile-diagram.js'
      - 'light-port-plan.js'
      - 'cura-model-advisor.js'
      - 'fabrication-v1.js'
      - 'tests/browser-smoke.mjs'
      - 'package.json'
      - '.github/workflows/browser-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'geometry-v3.js'
      - 'studio-v3.js'
      - 'hardware-editor.js'
      - 'hardware-layout.js'
      - 'wire-routing.js'
      - 'print-advisor.js'
      - 'pixel-profiles.js'
      - 'cura-profiles.js'
      - 'print-quality.js'
      - 'optical-audit.js'
      - 'split-joints.js'
      - 'design-workflows.js'
      - 'production-pack.js'
      - 'pixel-profile-diagram.js'
      - 'light-port-plan.js'
      - 'cura-model-advisor.js'
      - 'fabrication-v1.js'
      - 'fabrication-worker.js'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/browser-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install JS dependencies and headless Chromium
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          (npm install --no-audit --no-fund && npx playwright install --with-deps chromium) > /tmp/browser-install.log 2>&1
          cat /tmp/browser-install.log | tail -n 25
      - name: Start local static host
        if: steps.install.outcome == 'success'
        run: |
          python3 -m http.server 4321 > /tmp/crystal-forge-server.log 2>&1 &
          sleep 2
      - name: Exercise live browser and fabrication pipeline
        if: steps.install.outcome == 'success'
        id: browser
        continue-on-error: true
        run: |
          mkdir -p qa
          set +e
          npm run test:browser > browser-run.log 2>&1
          status=$?
          cat browser-run.log
          exit "$status"
      - name: Upload browser test output log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-forge-browser-test-log
          path: browser-run.log
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crystal-forge-browser-screenshot
          path: qa/browser-smoke.png
          if-no-files-found: ignore
      - name: Fail on browser errors
        if: steps.install.outcome != 'success' || steps.browser.outcome != 'success'
        run: exit 1
