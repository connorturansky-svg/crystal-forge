name: Static repository checks
# Prior commits should not queue redundant hour-long PR regression jobs.
concurrency:
  group: crystal-forge-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, feat/verified-tile-gear-routing, 'wt018/**']
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'index.html'
      - 'package.json'
      - 'tests/**'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/workflows/static-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release metadata against main
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
        run: node tests/release-metadata.mjs "$RELEASE_BASE"
      - name: Verify release metadata
        if: github.event_name != 'pull_request'
        run: node tests/release-metadata.mjs
      - name: Syntax, local import and HTML wiring checks
        run: npm run test:static
      - name: Test valid contributor tasks and duplicate claim rejection
        run: python3 tests/ai-pr-contract.test.py
