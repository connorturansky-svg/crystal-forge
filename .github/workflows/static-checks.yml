name: Static repository checks
# Prior commits should not queue redundant hour-long PR regression jobs.
concurrency:
  group: crystal-forge-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, feat/wt022-workspaces, feat/verified-tile-gear-routing, feat/backed-family-cable-routing, feat/studio-svg-artwork-import, 'wt018/**', 'wt019/**']
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'index.html'
      - 'package.json'
      - 'tests/**'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/workflows/static-checks.yml'
      - '**/*.js'
      - '*.css'
      - '**/*.css'
      - '**/*.html'
      - '**/*.svg'
      - '**/*.wasm'
      - 'svg-import/**'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release metadata against main
        if: github.event_name == 'pull_request'
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Workflow, docs and test-only PRs do not represent a new product release.
          # They still validate current changelog/version/What's New parity.
          version_required=0
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/*|docs/*|tests/*|prompts/*|scripts/pages-retain-deployed.mjs|AGENTS.md|CONTRIBUTING.md|README.md) ;;
              *) version_required=1; break ;;
            esac
          done < <(git diff --name-only "$RELEASE_BASE" HEAD)
          if [ "$version_required" -eq 1 ]; then
            node tests/release-metadata.mjs "$RELEASE_BASE"
          else
            node tests/release-metadata.mjs
          fi
      - name: Verify release metadata
        if: github.event_name != 'pull_request'
        run: node tests/release-metadata.mjs
      - name: Syntax, local import and HTML wiring checks
        run: npm run test:static
      - name: Rank Studio tool searches
        run: node tests/studio-tool-search-core.test.mjs
      - name: Validate conservative CI path classifier
        run: node tests/ci-scope.test.mjs
      - name: Test valid contributor tasks and duplicate claim rejection
        run: python3 tests/ai-pr-contract.test.py
