name: Static repository checks
# Prior commits should not queue redundant hour-long PR regression jobs.
concurrency:
  group: crystal-forge-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'index.html'
      - 'package.json'
      - 'tests/**'
      - 'docs/**'
      - 'AGENTS.md'
      - '.github/workflows/static-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax, local import and HTML wiring checks
        run: npm run test:static
