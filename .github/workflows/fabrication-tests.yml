name: Verify Crystal Forge fabrication
on:
  push:
    branches: [main]
    paths:
      - 'geometry-v3.js'
      - 'fabrication-v1.js'
      - 'studio-v3.js'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/fabrication-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Exercise real Manifold WASM meshes
        id: smoke
        continue-on-error: true
        run: |
          set +e
          npm test > fabrication-run.log 2>&1
          status=$?
          cat fabrication-run.log
          exit "$status"
      - name: Upload full fabrication test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabrication-test-log
          path: fabrication-run.log
          if-no-files-found: ignore
      - name: Fail on real geometry errors
        if: steps.smoke.outcome != 'success'
        run: exit 1
