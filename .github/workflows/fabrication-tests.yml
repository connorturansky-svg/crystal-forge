name: Verify Crystal Forge fabrication
on:
  push:
    branches: [main]
    paths:
      - 'geometry-v3.js'
      - 'fabrication-v1.js'
      - 'studio-v3.js'
      - 'package.json'
      - 'tests/**'
      - '.github/workflows/fabrication-tests.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Exercise real Manifold WASM meshes
        id: smoke
        continue-on-error: true
        run: npm test > fabrication-run.log 2>&1
      - name: Publish diagnostic log in the repository
        if: always()
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
          REF: ${{ github.sha }}
        run: |
          mkdir -p qa
          {
            echo "Fabrication smoke tests: $OUTCOME"
            echo "Commit: $REF"
            echo
            if [ -f fabrication-run.log ]; then cat fabrication-run.log; else echo "Tests did not reach execution"; fi
          } > qa/latest-fabrication-test.log
          git config user.name "Crystal Forge CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/latest-fabrication-test.log
          git commit -m "ci: publish fabrication test results [skip ci]" || true
          git push || true
      - name: Enforce geometry test outcome
        if: steps.smoke.outcome != 'success'
        run: exit 1
