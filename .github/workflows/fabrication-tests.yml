name: Verify Crystal Forge fabrication
on:
  push:
    branches: [main]
    paths:
      - '*.js'
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/fabrication-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - '*.js'
      - 'index.html'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/fabrication-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: npm install --no-audit --no-fund
      - name: Exercise real Manifold WASM meshes
        id: smoke
        continue-on-error: true
        run: |
          set +e
          npm test > fabrication-run.log 2>&1
          status=$?
          cat fabrication-run.log
          exit "$status"
      - name: Benchmark representative solid + vault fabrication
        if: steps.smoke.outcome == 'success'
        id: benchmark
        continue-on-error: true
        env:
          CRYSTAL_FORGE_MAX_PREP_MS: '90000'
          CRYSTAL_FORGE_BENCH_EXTENDED: '1'
        run: |
          npm run test:benchmark > benchmark-run.log 2>&1
          cat benchmark-run.log
      - name: Upload benchmark log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-forge-performance-benchmark
          path: benchmark-run.log
          if-no-files-found: ignore
      - name: Upload full fabrication test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fabrication-test-log
          path: fabrication-run.log
          if-no-files-found: ignore
      - name: Fail on real geometry and benchmark errors
        if: steps.smoke.outcome != 'success' || steps.benchmark.outcome != 'success'
        run: exit 1
