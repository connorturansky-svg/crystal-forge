name: Deploy Crystal Forge to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production release
        env:
          RELEASE_BASE: ${{ github.event.before }}
        run: node tests/release-metadata.mjs "$RELEASE_BASE"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage release assets
        run: |
          mkdir -p "_site/releases/$GITHUB_SHA"
          # Ship the COMPLETE revision. Root-only *.js copies omitted nested
          # ES modules (including svg-import/index.js), silently breaking startup.
          git archive HEAD | tar -x -C "_site/releases/$GITHUB_SHA"
          sed "s|<head>|<head><base href=\"./releases/$GITHUB_SHA/\"><meta name=\"studio-release\" content=\"$GITHUB_SHA\">|" index.html > _site/index.html
          node tests/pages-release-assets.test.mjs "_site/releases/$GITHUB_SHA"
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
