name: Deploy Crystal Forge to GitHub Pages
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: ['.github/workflows/pages.yml']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
  queue: max
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify production release
        env:
          RELEASE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A workflow/test-only change must not invent a new app release.
          # All changes still check version, changelog and What's New parity.
          version_required=0
          if [[ "$RELEASE_BASE" =~ ^[a-fA-F0-9]{40}$ ]] && [[ ! "$RELEASE_BASE" =~ ^0+$ ]]; then
            while IFS= read -r changed; do
              case "$changed" in
                .github/workflows/*|docs/*|tests/*|prompts/*|AGENTS.md|CONTRIBUTING.md|README.md) ;;
                *) version_required=1; break ;;
              esac
            done < <(git diff --name-only "$RELEASE_BASE" HEAD)
          fi
          if [ "$version_required" -eq 1 ]; then
            node tests/release-metadata.mjs "$RELEASE_BASE"
          else
            node tests/release-metadata.mjs
          fi
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push'
        with:
          enablement: true
      - name: Stage release assets
        run: |
          mkdir -p _site
          git archive HEAD | tar -x -C _site
          release="_site/releases/$GITHUB_SHA"
          mkdir -p "$release/vendor"
          cp _site/*.js _site/*.css "$release/"
          cp -R _site/svg-import "$release/"
          npm install --prefix "$RUNNER_TEMP/crystal-forge-vendor" --no-save --no-package-lock --ignore-scripts three@0.165.0 manifold-3d@3.5.4
          vendor="$RUNNER_TEMP/crystal-forge-vendor/node_modules"
          mkdir -p "$release/vendor/three" "$release/vendor/manifold"
          cp -R "$vendor/three/build" "$vendor/three/examples" "$vendor/three/LICENSE" "$release/vendor/three/"
          cp "$vendor/manifold-3d/manifold.js" "$vendor/manifold-3d/manifold.wasm" "$release/vendor/manifold/"
          sed -i 's|https://cdn.jsdelivr.net/npm/three@0.165.0/|./vendor/three/|g; s|https://cdn.jsdelivr.net/npm/manifold-3d@3.5.4/|./vendor/manifold/|g' "$release/"*.js
          sed "s|<head>|<head><base href=\"./releases/$GITHUB_SHA/\"><meta name=\"studio-release\" content=\"$GITHUB_SHA\">|; s|https://cdn.jsdelivr.net/npm/three@0.165.0/|./vendor/three/|g" index.html > _site/index.html
          test -s "$release/svg-import/index.js"
          test -s "$release/vendor/three/build/three.module.js"
          test -s "$release/vendor/manifold/manifold.wasm"
          touch _site/.nojekyll
      # This is the same _site that will be uploaded to Pages, not a source-tree test host.
      # Every production push must pass a real packaged-app Chromium journey.
      - name: Install staged-release browser dependencies
        timeout-minutes: 6
        run: |
          npm_config_fetch_retries=1 npm_config_fetch_timeout=40000 \
            npm install --prefer-offline --no-audit --no-fund --no-progress
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CRYSTAL_FORGE_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CRYSTAL_FORGE_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Serve staged release artifact
        run: |
          mkdir -p qa
          python3 -m http.server 4339 --bind 127.0.0.1 --directory _site > qa/pages-stage.log 2>&1 &
          for attempt in {1..20}; do
            if curl -fsS http://127.0.0.1:4339/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat qa/pages-stage.log
          exit 1
      - name: Verify staged application, assets, worker and STL in Chromium
        timeout-minutes: 7
        env:
          CRYSTAL_FORGE_URL: http://127.0.0.1:4339/
          CRYSTAL_FORGE_EXPECTED_RELEASE: ${{ github.sha }}
        run: node tests/pages-artifact-browser.mjs
      - name: Preserve staged release smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-forge-pages-staged-smoke
          path: |
            qa/pages-artifact-*.png
            qa/pages-stage.log
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push'
        with:
          path: _site
  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
