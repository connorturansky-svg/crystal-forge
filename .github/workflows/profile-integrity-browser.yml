name: Measured profile recovery browser
# Profile recovery is deliberately isolated from the 25-minute comprehensive
# browser regression. The comprehensive test ran out of time before reaching
# the new quota/restore test in PR #113.
on:
  pull_request:
    branches: [main]
    paths:
      - 'studio-profile-safety.js'
      - 'studio-v3.js'
      - 'sensory-studio.js'
      - 'studio-sync-plan.js'
      - 'studio-vault.js'
      - 'pixel-profiles.js'
      - 'tests/studio-profile-integrity-browser.mjs'
      - '.github/workflows/profile-integrity-browser.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'studio-profile-safety.js'
      - 'studio-v3.js'
      - 'sensory-studio.js'
      - 'studio-sync-plan.js'
      - 'studio-vault.js'
      - 'pixel-profiles.js'
      - 'tests/studio-profile-integrity-browser.mjs'
      - '.github/workflows/profile-integrity-browser.yml'
      - 'package.json'
  workflow_dispatch:
concurrency:
  group: crystal-forge-profile-recovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  profile-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install browser test dependencies
        timeout-minutes: 6
        run: |
          npm_config_fetch_retries=1 npm_config_fetch_timeout=40000 \
            npm install --prefer-offline --no-audit --no-fund --no-progress
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CRYSTAL_FORGE_BROWSER_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CRYSTAL_FORGE_BROWSER_EXECUTABLE=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            npx playwright install chromium
          fi
      - name: Start isolated local app host
        run: |
          mkdir -p qa
          python3 -m http.server 4321 --bind 127.0.0.1 > qa/profile-recovery-host.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4321/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat qa/profile-recovery-host.log
          exit 1
      - name: Test quota, calibration and isolated-browser restoration
        timeout-minutes: 8
        env:
          CRYSTAL_FORGE_URL: http://127.0.0.1:4321/
        run: |
          set -o pipefail
          node tests/studio-profile-integrity-browser.mjs 2>&1 | tee qa/profile-integrity-browser.log
      - name: Preserve focused browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-integrity-browser-evidence
          path: |
            qa/profile-integrity-browser.log
            qa/profile-recovery-host.log
          if-no-files-found: warn
